<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#e7f1ed"/></linearGradient><linearGradient id="film" x2="0" y2="1"><stop stop-color="#cee8d8"/><stop offset="1" stop-color="#77bba1"/></linearGradient><radialGradient id="cap"><stop stop-color="#fff"/><stop offset=".8" stop-color="#c6e9dc"/><stop offset="1" stop-color="#89beab"/></radialGradient><marker id="head" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#d3a04a" stroke-width="1.4"/></marker></defs><rect width="1200" height="780" rx="32" fill="url(#bg)"/><text x="65" y="88" fill="#485e51" font-family="serif" font-size="34">紫外線から、毎日の肌を守る仕組み</text><text x="67" y="124" fill="#819586" font-family="sans-serif" font-size="16" letter-spacing="3">SILASOMA TECHNOLOGY</text><circle cx="170" cy="222" r="51" fill="#f8d887"/><g stroke="#dfbd62" stroke-width="6"><path d="M170 147v-23 M170 297v23 M95 222H72 M245 222h23 M118 170l-18-18 M222 274l18 18 M222 170l18-18 M118 274l-18 18"/></g><g stroke="#d4a14e" stroke-width="7" fill="none" marker-end="url(#head)"><path d="M265 214 Q350 220 388 348"/><path d="M310 170 Q425 170 474 346"/><path d="M361 205 Q470 207 552 348"/></g><g stroke="#bd934c" stroke-width="7" fill="none" marker-end="url(#head)"><path d="M390 349 Q334 295 281 298"/><path d="M474 346 Q425 271 393 254"/><path d="M552 348 Q512 284 480 270"/></g><text x="325" y="154" fill="#927744" font-family="sans-serif" font-size="20">UV-A / UV-B</text><rect x="72" y="348" width="1050" height="110" rx="45" fill="url(#film)" stroke="#6ba58a" stroke-width="5"/><text x="90" y="392" fill="#305c4b" font-size="30" font-family="serif">UVベースの膜</text><text x="90" y="430" fill="#305c4b" font-size="17" font-family="sans-serif">紫外線を吸収・散乱する働き</text><g transform="translate(665 366)"><circle r="34" fill="url(#cap)" stroke="#d9f7e9" stroke-width="5"/><circle cx="-8" cy="-9" r="9" fill="#f0c577"/><circle cx="13" cy="-1" r="7" fill="#b6d5ca"/><circle cx="1" cy="14" r="9" fill="#a6cedb"/></g><g transform="translate(790 398) scale(.83)"><circle r="34" fill="url(#cap)" stroke="#d9f7e9" stroke-width="5"/><circle cx="-8" cy="-9" r="9" fill="#f0c577"/><circle cx="13" cy="-1" r="7" fill="#b6d5ca"/><circle cx="1" cy="14" r="9" fill="#a6cedb"/></g><g transform="translate(885 378) scale(1.05)"><circle r="34" fill="url(#cap)" stroke="#d9f7e9" stroke-width="5"/><circle cx="-8" cy="-9" r="9" fill="#f0c577"/><circle cx="13" cy="-1" r="7" fill="#b6d5ca"/><circle cx="1" cy="14" r="9" fill="#a6cedb"/></g><text x="657" y="478" fill="#5b806b" font-size="16">シラソーマのイメージ</text><path d="M66 522 Q590 482 1130 522 L1130 615 Q590 581 66 615Z" fill="#efc9b8" stroke="#dcae9e" stroke-width="4"/><path d="M66 590 Q600 564 1130 590 L1130 661 Q590 641 66 661Z" fill="#e8ad9f" opacity=".65"/><text x="90" y="560" fill="#8b5c50" font-size="24">肌表面</text><text x="90" y="713" font-family="sans-serif" font-size="19" fill="#485f55">紫外線吸収剤をシルク由来成分などで包み込むカプセル化技術</text><text x="90" y="746" font-family="sans-serif" font-size="13" fill="#667d72">※働きを説明する概念図。すべての紫外線が反射することや、完全な遮断を意味しません。</text></svg>