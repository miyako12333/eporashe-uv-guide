<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 650" role="img" aria-labelledby="title desc"><title id="title">シラソーマ製法の説明図</title><desc id="desc">左に紫外線吸収剤をシルク由来のコーティングで包み込んだカプセルの構造。右に肌表面のUVベースの層に向かって入射し、一部は上向きの矢印で示される紫外線防御の模式図。</desc><defs><radialGradient id="shell"><stop offset="0" stop-color="#f9feff"/><stop offset=".67" stop-color="#b2e2f2"/><stop offset="1" stop-color="#7cbfd5"/></radialGradient><radialGradient id="core"><stop stop-color="#ffe3db"/><stop offset="1" stop-color="#e5a1ab"/></radialGradient><linearGradient id="skin" x2="0" y2="1"><stop stop-color="#fee5ce"/><stop offset="1" stop-color="#f0bca9"/></linearGradient><marker id="arrow" orient="auto" markerWidth="8" markerHeight="8" refX="6" refY="3"><path d="M0 0L6 3L0 6" stroke="#c25164" stroke-width="1.6" fill="none"/></marker></defs><rect width="920" height="650" rx="24" fill="#f6faf6"/><rect x="22" y="22" width="876" height="606" rx="20" fill="#fffefa"/><text x="58" y="83" font-family="serif" font-size="35" fill="#33493f">シラソーマ製法とは</text><text x="60" y="121" font-family="sans-serif" font-size="19" fill="#577268">紫外線吸収剤をシルク由来成分でコーティングする技術</text><path d="M58 160h804" stroke="#d9e5dc"/><text x="224" y="202" font-family="sans-serif" text-anchor="middle" font-size="20" fill="#446458">01　カプセルのしくみ</text><circle cx="226" cy="369" r="121" fill="url(#shell)" stroke="#78b7c9" stroke-width="3"/><circle cx="226" cy="369" r="65" fill="url(#core)" stroke="#d58f9b" stroke-width="2"/><text x="226" y="362" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#744c52">紫外線</text><text x="226" y="391" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#744c52">吸収剤</text><path d="M142 278L99 231H60" stroke="#66867c" stroke-width="2" fill="none"/><text x="62" y="225" font-family="sans-serif" font-size="16" fill="#42645a">シルク由来成分による</text><text x="62" y="245" font-family="sans-serif" font-size="16" fill="#42645a">コーティング</text><path d="M366 369H434" stroke="#91a49c" stroke-width="2" stroke-dasharray="5 7"/><text x="675" y="202" font-family="sans-serif" text-anchor="middle" font-size="20" fill="#446458">02　肌表面でのUV防御</text><g fill="url(#skin)" stroke="#e9b9a7" stroke-width="1.5"><rect x="478" y="492" width="393" height="92" rx="22"/><path d="M479 516H872M479 547H872" stroke="#f8d5c3"/></g><g fill="url(#shell)" stroke="#7dbed0" stroke-width="2"><circle cx="503" cy="463" r="27"/><circle cx="560" cy="463" r="27"/><circle cx="617" cy="463" r="27"/><circle cx="674" cy="463" r="27"/><circle cx="731" cy="463" r="27"/><circle cx="788" cy="463" r="27"/><circle cx="845" cy="463" r="27"/><circle cx="531" cy="417" r="27"/><circle cx="588" cy="417" r="27"/><circle cx="645" cy="417" r="27"/><circle cx="702" cy="417" r="27"/><circle cx="759" cy="417" r="27"/><circle cx="816" cy="417" r="27"/></g><g fill="none" stroke="#cb6070" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"><path d="M542 253L586 380L518 277"/><path d="M669 249L719 381L642 281"/><path d="M812 255L763 379L847 272"/></g><text x="668" y="599" font-family="sans-serif" font-size="17" fill="#775b53" text-anchor="middle">肌表面</text><text x="683" y="392" font-family="sans-serif" font-size="16" fill="#517c78" text-anchor="middle">UVベースの層</text><text x="460" y="623" font-family="sans-serif" font-size="13" fill="#788a83" text-anchor="middle">公式参考図に基づく模式図。紫外線の全量が反射されることを意味するものではありません。</text></svg>