name: Publish Original Silasoma PNG
on:
  push:
    paths:
      - '.github/workflows/render-silasoma.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original PNG without redrawing
        run: |
          curl --fail --location --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_32a7XXQFux0gfG2cgMkQgLQk5JP/ce2222d2-da3e-4cbb-8de3-62bd0fedd262.png' --output assets/silasoma_beautiful_original.png
          file assets/silasoma_beautiful_original.png
          test "$(stat -c %s assets/silasoma_beautiful_original.png)" -gt 1000000
      - name: Commit original image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/silasoma_beautiful_original.png
          if ! git diff --cached --quiet; then
            git commit -m "Add original generated Silasoma PNG"
            git push
          fi
